<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="alsmith.dev">
  <title>alsmith.dev</title>
  <!-- the homepage's two ribbons: rose coming down the left, amber coming up
       the right, offwhite either side of them and down the middle. Every edge
       sits on a multiple of four so nothing lands mid-pixel at 16, 32 or 48 -->
