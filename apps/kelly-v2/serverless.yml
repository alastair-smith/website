service: kelly-v2
frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs24.x
  region: eu-west-1

plugins:
  - serverless-esbuild

custom:
  esbuild:
    exclude:
      - canvas

package:
  exclude:
    - node_modules/**
  include:
    - src/assets

functions:
  api:
    handler: src/index.handler
    layers:
      - arn:aws:lambda:eu-west-1:523361676583:layer:gif-maker:1
    events:
      - httpApi:
          path: /
          method: get
