name: Validate App
run-name: ${{ github.actor }} is validating application code on branch ${{ github.head_ref }} 🚀
on: [pull_request]

jobs:
  audit-node-modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - name: Use Node.js 24.16.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
      - name: Audit packages
        run: pnpm audit || echo allow failure

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - name: Use Node.js 24.16.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      - name: Install dependencies
        run: pnpm install -w
      - name: Lint and check formatting
        run: pnpm run -w check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - name: Use Node.js 24.16.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      - name: Install dependencies
        run: pnpm install --filter @alastair-smith/web
      - name: Tests
        run: pnpm run --dir "./apps/web" test:ci

  deploy-preview:
    runs-on: ubuntu-latest
    needs:
      - audit-node-modules
      - test
      - check
    outputs:
      preview-url: ${{ steps.upload.outputs.preview-url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - name: Use Node.js 24.16.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      - name: Install dependencies
        run: pnpm install --filter @alastair-smith/web
      - name: Build
        run: pnpm run --dir "./apps/web" build
      # Uploads a new Worker version without shifting production traffic. The
      # alias gives the branch a stable preview URL, like Pages branch previews.
      - name: Upload preview version
        id: upload
        env:
          HEAD_REF: ${{ github.head_ref }}
          WRANGLER_OUTPUT_FILE_DIRECTORY: ${{ github.workspace }}/wrangler-output
        run: |
          alias=$(printf '%s' "$HEAD_REF" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9-]/-/g' \
            | cut -c1-40 \
            | sed 's/^-*//; s/-*$//')
          pnpm run --dir "./apps/web" deploy:preview --preview-alias "$alias"
          url=$(jq -rs '
            map(select(.type == "version-upload"))
            | last
            | .preview_alias_url // .preview_url // empty
          ' "$WRANGLER_OUTPUT_FILE_DIRECTORY"/*.json)
          echo "preview-url=$url" >> "$GITHUB_OUTPUT"

  register-deployment:
    runs-on: ubuntu-latest
    needs: [deploy-preview]
    if: needs.deploy-preview.outputs.preview-url != ''
    steps:
      - name: Register Deployment
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ needs.deploy-preview.outputs.preview-url }}
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `${{ github.head_ref }}`,
              environment: `preview-${{ github.head_ref }}`,
              auto_merge: false,
              transient_environment: true,
              required_contexts: [],
              production_environment: false
            })
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              environment_url: process.env.PREVIEW_URL
            })
